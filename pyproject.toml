[project]
name = "remus"
version = "0.6.0"
description = "The functional programming toolkit for Python."
readme = "README.md"
authors = [
    { name = "Romeyus", email = "marco.possamai@proton.me" }
]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
all = [
    "remus[net]",
]
net = [
    "aiofiles>=25.1.0",
    "asgiref>=3.12.1",
    "nanoroute>=2.0.5",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.coverage.run]
omit = ["*/__init__.py"]

[tool.ruff]
fix = true

[tool.pyright]
extraPaths = ["src"]
ignore = ["**/__pycache__"]
typeCheckingMode = "strict"

[tool.pytest]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
strict = true

[tool.uv.sources]
remus = { workspace = true }
