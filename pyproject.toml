[project]
name = "remus"
version = "0.4.0"
description = "The functional programming toolkit for Python."
readme = "README.md"
authors = [
    { name = "Romeyus", email = "marco.possamai@proton.me" }
]
requires-python = ">=3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[tool.coverage.run]
omit = [
    "*/__init__.py",
]

[tool.pytest]
addopts = [
    "--import-mode=importlib",
    "--cov=src/remus",
    "--cov-report=term-missing",
]
pythonpath = ["src"]
strict = true

[tool.ty.environment]
root = ["src"]
python-version = "3.15"

[tool.ty.rules]
all = "error"
